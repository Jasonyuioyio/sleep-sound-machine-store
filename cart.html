<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shopping Cart | Chicway</title>
  <meta name="description" content="Review Chicway cart items, adjust quantities, and continue to checkout.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&family=Epilogue:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="shop.css">
  <script src="shop.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <a class="brand" href="index.html">CHICWAY&reg;</a>
      <nav class="nav-links" aria-label="Primary">
        <a href="index.html">Home</a>
        <a href="products.html">All Products</a>
        <a class="active" href="cart.html">Cart</a>
      </nav>
      <div class="top-actions">
        <a class="icon-btn" href="cart.html" aria-label="Shopping cart">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path d="M3.5 5H5.4L7.7 15.2H18.2L20.2 8.1H7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
            <path d="M8.2 18.5H18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
            <circle cx="9" cy="20" r="1.2" fill="currentColor"></circle>
            <circle cx="17" cy="20" r="1.2" fill="currentColor"></circle>
          </svg>
          <span class="cart-count" data-cart-count hidden>0</span>
        </a>
        <a class="pill-btn" href="products.html">Shop Products</a>
      </div>
    </div>
  </header>

  <main>
    <section class="shop-hero cart-heading">
      <div class="container">
        <h1>Your shopping cart.</h1>
        <p>Review the products you added, adjust quantities, then decide whether to continue to checkout.</p>
      </div>
    </section>

    <section class="cart-section">
      <div class="container cart-grid">
        <div class="cart-items" data-cart-items></div>
        <aside class="summary-panel" data-cart-summary aria-label="Order summary"></aside>
      </div>
    </section>
  </main>
</body>
</html>
