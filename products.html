<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>All Products | Chicway</title>
  <meta name="description" content="Browse Chicway sleep products, compare features, and open product details before buying.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&family=Epilogue:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="shop.css">
  <script src="shop.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <a class="brand" href="index.html">CHICWAY&reg;</a>
      <nav class="nav-links" aria-label="Primary">
        <a href="index.html">Home</a>
        <a class="active" href="products.html">All Products</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="shop-hero">
      <div class="container shop-hero-grid">
        <div>
          <h1>Shop every Chicway sleep companion.</h1>
          <p>
            Browse the complete Soothe family, compare the formats, or open a product image
            to review the detail page before buying.
          </p>
        </div>
        <div class="hero-image">
          <img
            class="hero-image-contain"
            src="assets/banners/portable-preview.webp"
            width="1400"
            height="574"
            alt="Chicway portable sound machine lifestyle scene"
            decoding="async"
            fetchpriority="high"
          >
        </div>
      </div>
    </section>

    <section class="products-section">
      <div class="container">
        <div class="section-head">
          <div>
            <h2>All Products</h2>
            <p>Click a product image for details or use Buy Now to shop on Amazon.</p>
          </div>
        </div>
        <div class="product-grid" data-products-grid></div>
      </div>
    </section>
  </main>
</body>
</html>
